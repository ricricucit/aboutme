<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aligned CV opener</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@font-face{font-family:"Maison Neue";src:local("Helvetica Neue");font-weight:400}
:root{--ff:"Maison Neue","Helvetica Neue",Helvetica,Arial,sans-serif;--serif:"Times New Roman",Times,Georgia,serif;--lh:1.9rem}
*{box-sizing:border-box}body{margin:0}.page{min-height:100vh;padding:5rem clamp(1.25rem,5vw,2.5rem);background:#fff;color:#0a0a0a;font-family:var(--ff)}
.wrap{max-width:48rem;margin:auto}.opener{font-size:clamp(1.375rem,1.15rem + 1vw,1.625rem);line-height:1.45;letter-spacing:-.008em;margin:0}
.opener::first-letter{float:left;font-family:var(--serif);font-size:2.6em;line-height:.8;padding:.04em .12em 0 0;font-weight:400}
</style>
</head>
<body><div class="page"><main class="wrap"><p class="opener">Engineering and Product + AI Sitter @welance. Based in Berlin, Germany and Alta Langa, Italy.</p></main></div></body>
</html>
